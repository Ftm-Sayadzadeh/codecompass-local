[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecompass-local"
version = "0.1.0"
description = "Structure-aware retrieval over Python codebases with Persian Q&A."
requires-python = ">=3.11"
dependencies = ["chromadb>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
